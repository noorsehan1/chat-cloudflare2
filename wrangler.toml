name = "chat-cloudflare2"
main = "index.js"
compatibility_date = "2024-12-12"

# ==================== COMPATIBILITY FLAGS ====================
compatibility_flags = ["nodejs_compat"]

# ==================== DURABLE OBJECTS ====================
[durable_objects]
bindings = [
  { name = "CHAT_SERVER", class_name = "ChatServer" },
  { name = "GAME_SERVER", class_name = "GameServer" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatServer", "GameServer"]

# ==================== KV STORAGE UNTUK SOAL QUIZ ====================
[[kv_namespaces]]
binding = "QUESTIONS"
id = "556345248fb6411fa1b9bacd4740b922"
